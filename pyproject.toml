[project]
name = "idea-tracker"
version = "0.1.0"
description = "Deterministic idea tracking workflow engine with proposal-gated AI changes"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/idea_tracker"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
    "mypy",
    "fastapi",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic",
    "typer",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
